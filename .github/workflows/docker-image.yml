name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dsh-version:
        description: 'dsh 版本号(如 0.1.1-rc.2);留空则用 npm 最新版'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve dsh version
        id: dsh-version
        run: |
          V="${{ inputs.dsh-version }}"
          if [ -n "$V" ]; then
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "image-tag=dsh-$V" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "image-tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dsh-${{ steps.dsh-version.outputs.image-tag }},enable=${{ steps.dsh-version.outputs.image-tag != '' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DSH_VERSION=${{ steps.dsh-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
