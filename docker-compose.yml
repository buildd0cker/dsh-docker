# DeepSeek Harness Web UI - 一键启动
# 镜像由 GitHub Actions 构建并推送到 GHCR,这里直接拉取
services:
  dsh:
    image: ghcr.io/obrige/dsh-docker:latest
    pull_policy: always        # 每次 up 都拉取最新镜像
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"            # 宿主机端口:容器端口,改左边可换端口
    volumes:
      - ./data:/data           # DSH 配置/凭据/会话数据(持久化)
      - ./workspace:/workspace # 你的项目目录(agent 的工作区)
    environment:
      DSH_HOME: /data
